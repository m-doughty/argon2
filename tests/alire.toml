name = "argon2_tests"
description = "Tests and proofs for the Argon2 milestones"
version = "0.1.0-dev"

authors = ["Matt Doughty"]
maintainers = ["Matt Doughty <matt@apogee.guru>"]
maintainers-logins = ["m-doughty"]
licenses = "BSD-3-Clause"
executables = ["test_main"]

# GNATprove is development-only: consumers depend on the library crate.
[[depends-on]]
argon2 = "*"
gnatprove = "=16.1.0"

[[pins]]
argon2 = { path = ".." }

[build-switches]
"*".ada_version = "Ada2022"
validation.runtime_checks = "Everything"
validation.contracts = "Yes"
validation.compile_checks = "Errors"
