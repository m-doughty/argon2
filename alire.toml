name = "argon2"
description = "Argon2 (RFC 9106) in SPARK: H-prime, H0, block compression; early"
version = "0.1.0-dev"

authors = ["Matt Doughty"]
maintainers = ["Matt Doughty <matt@apogee.guru>"]
maintainers-logins = ["m-doughty"]
licenses = "BSD-3-Clause"
website = "https://github.com/m-doughty/argon2"
tags = ["spark", "argon2", "argon2id", "hash", "crypto", "proof"]

[[depends-on]]
blake2b = "=0.1.1"
gnat = ">=16"

[build-switches]
"*".ada_version = "Ada2022"
release.optimization = "Performance"
# Retain run-time checks while this milestone's proof is being established.
release.runtime_checks = "Everything"
release.contracts = "Yes"
validation.runtime_checks = "Everything"
validation.contracts = "Yes"
validation.compile_checks = "Errors"
